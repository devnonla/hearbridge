name: Release

# Push a tag vX.Y.Z (scripts/release.ts does it) to build the Apple Silicon app,
# sign the update archive and publish a GitHub release with:
#   HearBridge_<version>_aarch64.dmg            installer
#   HearBridge_<version>_aarch64.app.tar.gz(.sig) in-app update archive
#   latest.json                                  feed read by the app (plugins.updater in tauri.conf.json)
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   required for in-app updates
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY   optional Developer ID signing
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                                 optional notarization
# Without the Apple secrets the app is ad-hoc signed (users run `xattr -cr`), as before.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version, tag and changelog
        run: bun scripts/version.ts --check --tag "$TAG"

      - name: Require the updater key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Without it the release has no latest.json and installed apps never see it."
            exit 1
          fi

      - name: Build app (DMG + signed update archive)
        run: bun scripts/build-app.ts --target aarch64-apple-darwin --archive

      - name: Update manifest and release notes
        run: bun scripts/updater-manifest.ts && cat release/latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hearbridge-${{ env.TAG }}-macos-aarch64
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s extglob
          FILES=(release/!(notes.md))
          PRERELEASE=()
          # vX.Y.Z-beta.N: a pre-release is not "latest", so installed apps are not offered it.
          if [[ "$TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its assets"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file release/notes.md --draft=false "${PRERELEASE[@]}"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "HearBridge $TAG" \
              --notes-file release/notes.md \
              --verify-tag \
              "${PRERELEASE[@]}"
          fi
