[package]
name = "hearbridge"
version = "0.1.0"
description = "HearBridge — open-source live meeting captions & simultaneous interpretation"
authors = ["Quy Pham Van"]
edition = "2024"
license = "MIT"

[lib]
name = "hearbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
dotenvy = "0.15"
base64 = "0.22"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["time", "rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=0.3.0"
core-media-rs = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
