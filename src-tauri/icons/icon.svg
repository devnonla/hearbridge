<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- HearBridge app icon. Source of truth: render with
       rsvg-convert -w 1024 -h 1024 src-tauri/icons/icon.svg -o hearbridge-icon.png
       bun tauri icon hearbridge-icon.png -->
  <title>HearBridge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a25a"/>
      <stop offset="0.55" stop-color="#dd7627"/>
      <stop offset="1" stop-color="#b9581a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1e4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.18  0 0 0 0 0.02  0 0 0 1 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100.0" y="100.0" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100.0" y="100.0" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100.0" y="100.0" width="824" height="824" fill="url(#glow)"/>
    <!-- water reflection of the bridge: the lower half of the waveform -->
    <g fill="#ffffff" opacity="0.30">
      <rect x="308.0" y="668.0" width="40" height="81.9" rx="20.0"/> <rect x="400.0" y="668.0" width="40" height="103.0" rx="20.0"/> <rect x="492.0" y="668.0" width="40" height="109.2" rx="20.0"/> <rect x="584.0" y="668.0" width="40" height="103.0" rx="20.0"/> <rect x="676.0" y="668.0" width="40" height="81.9" rx="20.0"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- tied-arch bridge whose hangers are a sound waveform -->
  <g filter="url(#lift)" fill="url(#fg)">
    <rect x="308.0" y="417.1" width="40" height="198.9" rx="20.0"/> <rect x="400.0" y="366.8" width="40" height="249.2" rx="20.0"/> <rect x="492.0" y="352.0" width="40" height="264.0" rx="20.0"/> <rect x="584.0" y="366.8" width="40" height="249.2" rx="20.0"/> <rect x="676.0" y="417.1" width="40" height="198.9" rx="20.0"/>
    <path d="M 257.3 378.9 A 366.6 366.6 0 0 1 766.7 378.9" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="30" stroke-linecap="round"/>
    <path d="M 221.0 614.0 A 292.6 292.6 0 0 1 803.0 614.0" fill="none" stroke="url(#fg)" stroke-width="50" stroke-linecap="round"/>
    <rect x="152" y="612" width="720" height="34" rx="17.0"/>
  </g>
</svg>
